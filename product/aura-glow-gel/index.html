<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Aura Glow Gel by Poonthalir — a brightening herbal gel infused with saffron, aloe vera and skin-loving botanicals." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../../images/logo.png" />
  <link rel="stylesheet" href="../../css/styles.css" />
</head>
<body>
  <header id="siteHeader" class="site-header">
    <div class="header-container">
      <a href="../../index.html" class="brand-logo-wrap" title="Poonthalir Home">
        <div class="brand-logo-img-box">
          <img src="../../images/logo.png" alt="Poonthalir Logo" class="brand-logo-img" />
        </div>
      </a>
      <ul class="nav-menu">
        <li><a href="../../index.html" class="nav-link">Home</a></li>
        <li><a href="../../index.html#story" class="nav-link">Our Story</a></li>
        <li><a href="../../products/index.html" class="nav-link">Products</a></li>
        <li><a href="../../index.html#contact" class="nav-link">Contact</a></li>
      </ul>
      <div style="display:flex; align-items:center; gap:12px;">
        <a href="https://wa.me/919677374237" target="_blank" class="btn-primary" style="padding:8px 20px; font-size:0.85rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span>WhatsApp</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <section id="productDetailsSection" class="product-details-container">
      <div id="productDetailsContainer"></div>
    </section>
  </main>

  <div id="imageZoomModal" class="zoom-modal-backdrop" onclick="if(event.target === this) closeImageZoomModal()">
    <div class="zoom-modal-header">
      <span id="zoomModalTitle" class="zoom-modal-title">Poonthalir Product Detail</span>
      <button class="zoom-close-btn" onclick="closeImageZoomModal()" title="Close (Esc)">✕</button>
    </div>
    <div class="zoom-modal-body">
      <img id="zoomModalImg" src="" alt="Zoomed Product View" class="zoom-modal-img" />
    </div>
    <div class="zoom-modal-controls">
      <button id="zoomInBtn" class="zoom-ctrl-btn" onclick="adjustModalZoom(0.3)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        <span>Zoom In</span>
      </button>
      <button id="zoomOutBtn" class="zoom-ctrl-btn" onclick="adjustModalZoom(-0.3)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        <span>Zoom Out</span>
      </button>
      <button id="zoomResetBtn" class="zoom-ctrl-btn" onclick="resetModalZoom()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        <span>Reset</span>
      </button>
    </div>
  </div>

  <script type="module" src="../../js/app.js"></script>
</body>
</html>
